<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CV Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb, #4facfe, #667eea);
            background-size: 200% 100%;
            animation: gradient 3s linear infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .header h1 {
            font-size: 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .container {
            display: flex;
            height: calc(100vh - 86px);
        }

        .left-section {
            width: 45%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .left-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.3; }
        }

        .left-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }

        .section-title {
            color: white;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .session-info {
            color: rgba(255,255,255,0.95);
            font-size: 13px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        textarea {
            width: 100%;
            flex: 1;
            padding: 20px;
            border: none;
            border-radius: 15px;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            transition: all 0.3s;
            background: white;
        }

        textarea:focus {
            outline: none;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        .generate-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .generate-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .generate-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.5);
        }

        .generate-btn:active {
            transform: translateY(-1px);
        }

        .generate-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-text {
            position: relative;
            z-index: 1;
        }

        .right-section {
            width: 55%;
            background: #f8f9fa;
            padding: 40px;
            overflow-y: auto;
            background-image: 
                linear-gradient(45deg, #f0f0f0 25%, transparent 25%),
                linear-gradient(-45deg, #f0f0f0 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #f0f0f0 75%),
                linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        .cv-preview {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            min-height: 500px;
            overflow: hidden;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 40px;
            color: #666;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-right: 5px solid #764ba2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 25px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            font-size: 18px;
            color: #764ba2;
            font-weight: 600;
        }

        .placeholder {
            text-align: center;
            padding: 80px 40px;
            color: #999;
        }

        .placeholder h2 {
            font-size: 28px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .placeholder p {
            font-size: 16px;
            line-height: 1.6;
        }

        .placeholder-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .error {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin: 20px;
            box-shadow: 0 8px 25px rgba(238, 90, 111, 0.3);
        }

        .error h3 {
            margin-bottom: 10px;
            font-size: 20px;
        }

        .error p {
            margin: 5px 0;
            opacity: 0.95;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✨ AI CV Generator ✨</h1>
    </div>
    
    <div class="container">
        <div class="left-section">
            <div class="left-content">
                <div>
                    <h2 class="section-title">📝 Your Information</h2>
                    <div class="session-info">🔐 Session ID: <span id="sessionId"></span></div>
                </div>
                <textarea id="cvInput" placeholder="Enter your CV information here...&#10;&#10;Example:&#10;&#10;Name: Sarah Johnson&#10;Email: sarah.johnson@email.com&#10;Phone: +1 (555) 123-4567&#10;LinkedIn: linkedin.com/in/sarahjohnson&#10;&#10;Professional Summary:&#10;Experienced software engineer with 5+ years in full-stack development...&#10;&#10;Experience:&#10;Senior Software Engineer at Tech Corp (2020-2023)&#10;- Led development of microservices architecture&#10;- Improved system performance by 40%&#10;&#10;Education:&#10;BS Computer Science - MIT (2018)&#10;&#10;Skills:&#10;JavaScript, Python, React, Node.js, AWS, Docker"></textarea>
                <button class="generate-btn" id="generateBtn">
                    <span class="btn-text">🚀 Generate CV</span>
                </button>
            </div>
        </div>
        
        <div class="right-section">
            <div class="cv-preview" id="cvPreview">
                <div class="placeholder">
                    <div class="placeholder-icon">📄</div>
                    <h2>Your Professional CV Awaits!</h2>
                    <p>Fill in your information on the left and click "Generate CV"<br>to create your stunning professional resume</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function getSessionId() {
            let sessionId = sessionStorage.getItem('cv_session_id');
            if (!sessionId) {
                sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                sessionStorage.setItem('cv_session_id', sessionId);
            }
            return sessionId;
        }

        const sessionId = getSessionId();
        document.getElementById('sessionId').textContent = sessionId;

        async function generateCV() {
            const input = document.getElementById('cvInput').value.trim();
            const previewDiv = document.getElementById('cvPreview');
            const btn = document.getElementById('generateBtn');

            if (!input) {
                alert('⚠️ Please enter your CV information');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="btn-text">⏳ Generating...</span>';
            previewDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Creating your professional CV...</p>
                </div>
            `;

            try {
                const response = await fetch('https://n8n-gjwvahpd.us-west-1.clawcloudrun.com/webhook-test/resume', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        sessionId: sessionId,
                        cvData: input
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.html) {
                    previewDiv.innerHTML = data.html;
                } else if (data.htmlContent) {
                    previewDiv.innerHTML = data.htmlContent;
                } else if (typeof data === 'string') {
                    previewDiv.innerHTML = data;
                } else {
                    previewDiv.innerHTML = `<div style="padding: 20px; font-family: monospace; white-space: pre-wrap;">${JSON.stringify(data, null, 2)}</div>`;
                }

            } catch (error) {
                console.error('Error generating CV:', error);
                previewDiv.innerHTML = `
                    <div class="error">
                        <h3>❌ Error Generating CV</h3>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <p>Please check your connection and try again.</p>
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span class="btn-text">🚀 Generate CV</span>';
            }
        }

        document.getElementById('generateBtn').addEventListener('click', generateCV);
        
        document.getElementById('cvInput').addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                generateCV();
            }
        });
    </script>
</body>
</html>
